  height: 28px;

  min-height: 72px;

.form-control:focus-visible {

}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:

    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:

    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

  min-height: 20px;
  align-items: center;
  gap: 6px;

  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;

  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)

}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {

}

  height: 100%;
  background: var(--primary-foreground);

  height: 14px;
  border-radius: var(--radius-full);

.form-range:focus-visible::-moz-range-thumb {

}

.form-range:disabled {
  cursor: not-allowed;

.btn:not(.btn-primary, .viz-tile):is(

.btn:focus-visible,

  outline-offset: 2px;

}

    const quizzes = {&quot;origin&quot;: [{&quot;type&quot;: &quot;개념&quot;, &quot;q&quot;: &quot;노동과 노동력은 어떻게 다르며, 고용계약에서 거래되는 것은 무엇인가?&quot;, &quot;a&quot;: &quot;노동은 인간이 상품과 서비스를 생산·공급하는 실제 활동이고, 노동력은 그러한 노동을 수행할 수 있는 능력이다. 원문은 노동을 물질적·정신적 부의 원천이자 인간 삶의 기초로 설명하며, 사람은 생산된 상품과 서비스를 소비하여 자신의 노동력을 재생산한다고 서술한다. 따라서 노동이라는 활동과 노동할 수 있는 능력을 구별해야 한다.\n\n고용계약에서 거래되는 것은 노동자 자체의 소유권이 아니라 일정 기간 노동력을 사용할 권리이다. 저자는 “일반상품의 매매는 소유권의 이전을 가져오지만, 노동력의 매매는 일시적인 사용권의 매매를 가져올 뿐이다.”라고 설명한다(본문 37쪽, PDF 10쪽). 노동자는 자신의 노동력을 제공하고 그 대가로 임금을 받는다.\n\n다만 노동력은 노동자의 인격과 분리될 수 없으므로, 노동자는 생산현장에 직접 가서 사용자의 지휘·관리 아래 일한다. 이 때문에 거래는 가격을 정하는 데서 끝나지 않고, 고용주와의 관계·노동 내용·작업환경·근로조건의 문제로 이어진다. 답안에서는 ‘활동과 능력의 구별 → 일시적 사용권의 거래 → 인격과 불가분이므로 고용관계 발생’의 연결을 설명해야 한다.&quot;, &quot;pages&quot;: &quot;본문 30쪽, 37~38쪽 · PDF 3쪽, 10~11쪽&quot;, &quot;keywords&quot;: &quot;활동 / 능력 / 일시적 사용권&quot;}, {&quot;type&quot;: &quot;과정&quot;, &quot;q&quot;: &quot;노동력의 상품화가 이루어지는 역사적 과정을 설명하라.&quot;, &quot;a&quot;: &quot;노동력의 상품화는 봉건제의 해체와 생산자층의 분화 속에서 임금노동자가 형성되는 과정이다. 원문은 “여기서 임노동창출은 중산적 생산자층의 양극분해의 결과이고”라고 설명한다(본문 32쪽, PDF 5쪽). 즉, 생산자들이 동일한 지위에 머무르는 것이 아니라 일부는 자본과 생산수단을 축적하고, 다른 일부는 독립적으로 생계를 유지할 기반을 잃으면서 자본가와 임금노동자로 갈라진다.\n\n도시에서는 수공업 길드의 변화와 장인층 내부의 분화가 중요하다. 원문이 설명한 과정에서 상층 장인은 선대상인이나 독립적 매뉴팩처 경영주로 성장하지만, 하층 장인과 직인은 독립할 기회를 잃고 선대제에 종속되거나 공장제수공업에 고용되는 노동자가 된다. 농촌에서도 농민층의 분해가 임금노동자 형성의 중요한 경로가 된다. 봉건적 특권계급의 몰락만으로 이 과정을 설명해서는 부족하다.\n\n이렇게 생겨난 노동자는 신분적 예속에서 벗어나 노동력을 판매할 수 있으나 생산수단과 분리되어 있기 때문에, 자신과 가족의 생계를 위해 노동력을 팔아야 한다. 저자는 이 과정을 원시적 축적과 자본주의의 발달 과정에 연결한다. 다만 그 구체적인 시기와 특징은 국가마다 다르므로, 하나의 역사적 경로를 모든 나라에 동일하게 적용해서는 안 된다.&quot;, &quot;pages&quot;: &quot;본문 31~36쪽 · PDF 4~9쪽&quot;, &quot;keywords&quot;: &quot;봉건제 해체 / 생산자층 분화 / 생산수단 분리 / 임금노동&quot;}, {&quot;type&quot;: &quot;해석&quot;, &quot;q&quot;: &quot;임금노동자의 ‘이중의 자유’는 무엇을 뜻하는가?&quot;, &quot;a&quot;: &quot;‘이중의 자유’는 임금노동자가 지닌 두 가지 서로 다른 상태를 뜻한다. 원문은 이를 “‘신분적 예속으로부터의 자유’와 ‘생산수단으로부터의 자유’”라고 표현한다(본문 31쪽, PDF 4쪽). 첫째, 노동자는 노예나 농노처럼 다른 사람에게 신분적으로 예속되지 않으며 자기 노동력을 상품으로 제공할 수 있는 자유를 지닌다. 이는 노동력의 판매자가 법적·형식적으로 자유로운 계약 주체가 된다는 뜻이다.\n\n둘째, ‘생산수단으로부터의 자유’는 생산수단을 충분히 소유한다는 뜻이 아니라 오히려 생산수단에서 분리되어 있다는 뜻이다. 독립적으로 생산하여 자신과 가족의 생계를 유지할 기반이 없으므로, 자유로운 노동자는 자신의 노동력을 판매해야 한다. 원문은 바로 이 상태에 놓인 노동자가 노동력을 상품화하지 않을 수 없다고 설명한다.\n\n따라서 이중의 자유에는 신분적 구속에서 벗어났다는 측면과 생존을 위해 노동력 판매에 의존한다는 측면이 함께 있다. 시험에서는 ‘노동자가 아무런 제약 없이 자유롭다’고만 쓰면 부족하다. 신분적으로 자유로운 사람과 생산수단의 분리라는 두 조건이 결합하여 자본주의적 임금노동을 성립시킨다는 점까지 서술해야 한다.&quot;, &quot;pages&quot;: &quot;본문 31~32쪽 · PDF 4~5쪽&quot;, &quot;keywords&quot;: &quot;신분적 자유 / 생산수단으로부터의 분리&quot;}], &quot;special&quot;: [{&quot;type&quot;: &quot;개념&quot;, &quot;q&quot;: &quot;노동력상품의 특수성 여섯 가지를 제시하라.&quot;, &quot;a&quot;: &quot;원문이 제시하는 노동력상품의 특수성은 다음 여섯 가지이다. 첫째, 노동력은 살아 있는 노동자의 인격과 불가분이다. 노동력의 사용에는 노동자 본인이 참여하므로 임금뿐 아니라 사용자의 지휘·감독, 작업환경과 노사관계의 문제가 생긴다. 둘째, 노동력은 가치의 원천이며 사용되는 과정에서 숙련도·기능·지식이 향상될 수 있다. 사용하면 단순히 소모되는 일반 상품과 다른 점이다.\n\n셋째, 노동력은 저장하기 어렵고 사용하지 않아도 시간과 함께 소멸하며, 노동자는 생계를 위해 계속 팔아야 하므로 판매에서 불리해지기 쉽다. 넷째, 가격의 자동수급조정 기능이 약하고 특이하게 작용한다. 저임금 때문에 가족의 취업이나 장시간 노동이 늘어날 수 있고, 임금이 올라도 필요한 노동력을 즉시 공급하기 어렵다.\n\n다섯째, 육성·훈련에 오랜 시간이 필요하며 투자 성과도 늦게 나타난다. 지역 이동 역시 가족의 이동과 생활조건의 제약을 받는다. 여섯째, 원문은 “노동력은 차별화되기 쉬운 성질을 지닌 상품이다.”라고 명시한다(본문 39쪽, PDF 12쪽). 이 여섯 성질을 연결하면 노동시장은 임금이라는 가격만으로 즉시 조정되는 단순한 상품시장으로 보기 어렵다는 결론에 이른다.&quot;, &quot;pages&quot;: &quot;본문 37~39쪽 · PDF 10~12쪽&quot;, &quot;keywords&quot;: &quot;불가분 / 가치 창조 / 불리한 판매 / 조정 한계 / 긴 훈련 / 차별화&quot;}, {&quot;type&quot;: &quot;인과&quot;, &quot;q&quot;: &quot;노동력의 특수성은 왜 노동조합과 단체교섭의 필요성으로 이어지는가?&quot;, &quot;a&quot;: &quot;노동자는 노동력을 팔지 않으면 자신과 가족의 생계를 유지하기 어렵지만, 노동력은 저장해 두었다가 유리한 때에 한꺼번에 판매할 수 있는 상품이 아니다. 원문은 노동력이 저장·보관하기 어렵고 사용하지 않아도 시간적으로 소멸하는 성질을 지닌다고 설명한다. 따라서 노동자는 거래조건이 불리해도 판매를 쉽게 미룰 수 없어 개별 교섭에서 약한 위치에 놓이기 쉽다.\n\n일반 상품의 판매자는 공급을 제한하거나 수요를 늘려 가격을 높이려 할 수 있지만, 개별 노동자가 이러한 수단을 사용하기는 어렵다. 그래서 원문은 “그래서 제3의 방법으로서 노동조합을 통한 단체교섭(collective bargaining)이 이루어진다.”라고 서술한다(본문 38쪽, PDF 11쪽). 여러 노동자가 조직을 이루어 공동으로 교섭함으로써 개별 노동자가 가진 교섭력의 한계에 대응하는 것이다.\n\n본문 40쪽은 임금과 근로조건을 둘러싼 노사의 이해 대립 때문에 분쟁이 발생하며, 많은 국가가 노동자를 보호하기 위해 단결권·단체교섭권·단체행동권을 인정한다고 설명한다. 그러므로 노동조합의 필요성은 단순히 임금을 더 받고 싶다는 선호가 아니라 ‘저장 불가능성·생계 의존 → 개별 교섭의 불리함 → 집단적 교섭’이라는 노동력상품의 특수성에서 도출된다.&quot;, &quot;pages&quot;: &quot;본문 38쪽, 40쪽 · PDF 11쪽, 13쪽&quot;, &quot;keywords&quot;: &quot;저장 불가능 / 생계 압박 / 교섭력 / 단체교섭&quot;}, {&quot;type&quot;: &quot;분류&quot;, &quot;q&quot;: &quot;저자가 제시한 주요 노동문제 다섯 가지는 무엇인가?&quot;, &quot;a&quot;: &quot;첫째는 임금과 근로소득분배의 결정이다. 임금은 노동자에게 생계의 원천이고 사용자에게 비용이며, 국민경제에는 유효수요·물가·소득분배와 연결된다. 따라서 임금수준뿐 아니라 임금체계, 지급방법, 근로자 사이의 임금격차가 문제가 된다. 둘째는 근로조건이다. 비용과 이윤을 중시하는 사용자와 좋은 작업환경·짧은 노동시간·충분한 보수를 원하는 노동자의 이해가 충돌하며, 직업병·산업재해·노동강도 등이 쟁점이 된다.\n\n셋째는 노사관계이다. 임금과 근로조건의 대립을 다루는 노동조합의 조직과 기능, 단체교섭, 파업, 노동쟁의 조정 등이 포함된다. 넷째는 노동력 수요·공급의 불일치에 따른 실업과 고용이다. 실업의 규모뿐 아니라 어느 계층에 실업이 집중되는지, 필요한 노동력을 어떻게 개발할지, 완전고용과 물가안정이 양립하는지도 살펴야 한다. 다섯째는 노동력의 교육·훈련과 효율적 배분이다. 훈련의 비용·기간·효과와 함께 직업소개·취업지도·노동시장 정보망을 검토한다.\n\n저자는 “하나의 노동문제는 경제문제이면서 동시에 정치문제, 법률문제, 사회문제 등으로 직결되는 경우가 많다.”라고 강조한다(본문 41쪽, PDF 14쪽). 따라서 다섯 항목을 암기하는 데서 끝내지 말고, 각 문제가 서로 연결되며 다학문적 분석을 필요로 한다는 점까지 설명해야 한다.&quot;, &quot;pages&quot;: &quot;본문 39~41쪽 · PDF 12~14쪽&quot;, &quot;keywords&quot;: &quot;분배 / 근로조건 / 노사관계 / 고용 / 개발·배분&quot;}], &quot;single&quot;: [{&quot;type&quot;: &quot;개념&quot;, &quot;q&quot;: &quot;스미스의 보상임금 격차 논리를 설명하라.&quot;, &quot;a&quot;: &quot;스미스의 보상임금 격차 논리는 직업선택과 직장이동이 자유로운 경쟁시장에서, 직업의 유리한 조건과 불리한 조건을 모두 고려한 순이익이 균등해지는 경향이 있다는 설명이다. 특정 직업의 순이익이 더 크면 사람들이 그 직업으로 이동하고, 더 작으면 떠나므로 차이가 줄어든다고 본다. 이때 균등해지는 것은 명목임금 자체가 아니라 금전적 보수와 비금전적 조건을 합친 전체 이익이다.\n\n원문은 “즉 특정직종이 다른 직종에 비하여 어떤 측면에서 불이익이 있으면, 다른 측면에서의 높은 이익이 보상되는 이른바 보상원리(compensatory principle)가 작용한다.”라고 정리한다(본문 55쪽, PDF 28쪽). 임금격차를 낳는 요인으로 직업의 쾌적성, 일을 배우는 어려움과 비용, 고용의 안정성, 노동자에게 요구되는 신뢰, 직장에서의 성공가능성을 든다.\n\n따라서 위험하거나 불편하고 훈련비용이 큰 직업의 높은 임금은 그 불리함을 보상하는 것으로 해석될 수 있다. 그러나 원문은 실제로 불쾌하고 불안정한 직업의 노동자가 저임금을 받는 경우가 있다는 비판도 소개한다(본문 56쪽). 답안에서는 ‘경쟁과 이동이라는 전제 → 순이익 균등 → 보상적 임금격차 → 현실적 한계’까지 구별해야 한다.&quot;, &quot;pages&quot;: &quot;본문 54~56쪽 · PDF 27~29쪽&quot;, &quot;keywords&quot;: &quot;경쟁·이동 / 불리한 조건의 보상 / 순이익 균등&quot;}, {&quot;type&quot;: &quot;원리&quot;, &quot;q&quot;: &quot;신고전파는 노동수요·노동공급·임금을 어떻게 설명하는가?&quot;, &quot;a&quot;: &quot;신고전파의 기본 설명은 완전경쟁시장과 노동력의 동질성을 가정하고, 기업과 노동자의 합리적 선택을 노동수요·노동공급에 연결하는 것이다. 원문은 노동수요를 “기업가의 이윤극대화원리에 입각한 한계생산력설로” 설명한다고 서술한다(본문 56쪽, PDF 29쪽). 노동공급은 노동자의 효용극대화에 기초한 노동·여가 선택이론으로 설명하며, 임금은 노동수요·공급의 균형원리로 설명한다.\n\n기업 쪽에서는 추가로 노동을 투입했을 때 얻는 생산의 이익과 임금비용을 고려하여 고용량을 정한다. 노동자 쪽에서는 더 일하여 얻는 소득과 노동 대신 누릴 수 있는 여가를 비교하여 노동공급을 결정한다. 이 두 설명을 시장 수준에서 결합하면 노동수요와 노동공급이 균형을 이루는 지점에서 임금과 고용량이 결정된다는 논리가 된다.\n\n이 답안을 작성할 때는 기업의 목적은 이윤극대화, 노동자의 목적은 효용극대화라는 차이를 분명히 해야 한다. 또한 이 설명은 특정한 시장 가정 아래의 기본 모형이다. 본문에서 뒤이어 다루는 인적자본이론과 제도·분단 이론은 노동력의 차이, 훈련, 제도적 규칙 등을 통해 이 기본 모형이 충분히 설명하지 못하는 현실을 논의한다.&quot;, &quot;pages&quot;: &quot;본문 56쪽 · PDF 29쪽&quot;, &quot;keywords&quot;: &quot;이윤극대화 / 한계생산력 / 노동·여가 선택 / 수급 균형&quot;}, {&quot;type&quot;: &quot;인과&quot;, &quot;q&quot;: &quot;인적자본이론은 소득 격차를 어떻게 설명하고 어떤 정책을 중시하는가?&quot;, &quot;a&quot;: &quot;인적자본이론은 교육·훈련에 대한 투자가 노동력의 질과 생산성을 높이고, 그 결과 근로소득의 차이가 생긴다고 설명한다. 원문은 노동력의 양적 증가만으로 경제성장을 설명하기 어려웠던 문제와 소득불평등의 원인에 대한 관심 속에서 이 이론이 정교해졌다고 소개한다. 학교교육뿐 아니라 현장훈련·경험·지식에 대한 투자도 중요하다.\n\n투자량이 다른 이유는 능력과 기회가 다르기 때문이다. 교육·훈련에서 기대하는 수익은 개인 능력에 따라 달라지고, 투자에 필요한 자금을 마련하는 비용은 가정배경·자금차입능력·차입비용 등에 따라 달라진다. 원문은 “그 결과 개인마다 인적자본투자량이 서로 다르게 되고 그에 따라 생산성의 차이(투자수익의 차이)가 발생하여 임금격차현상이 나타나게 된다.”라고 설명한다(본문 62쪽, PDF 35쪽).\n\n따라서 임금격차 완화를 위한 중요한 정책은 교육·훈련 투자와 그 기회의 확대이다. 다만 이론은 경쟁적인 시장에서 임금격차가 기본적으로 생산성격차를 반영한다고 본다. 생산성 외의 기준에 따른 차별은 경쟁에 의해 약화된다고 설명하기 때문에, 제도적 장벽이나 지속적인 차별이 중요한 현실을 검토할 때는 이 가정 자체를 함께 점검해야 한다.&quot;, &quot;pages&quot;: &quot;본문 59~62쪽 · PDF 32~35쪽&quot;, &quot;keywords&quot;: &quot;투자 / 생산성 / 소득 / 능력·기회 / 교육 확대&quot;}], &quot;segment&quot;: [{&quot;type&quot;: &quot;개념&quot;, &quot;q&quot;: &quot;내부노동시장의 형성요인 세 가지와 작동 방식을 설명하라.&quot;, &quot;a&quot;: &quot;내부노동시장의 세 형성요인은 기업특수기술, 현장훈련(OJT), 기업 내 관습이다. 기업특수기술은 특정 기업에서 특히 유용한 기술이므로 기업이 훈련비용을 부담한 노동자가 이직하면 기업은 손실을 입는다. 노동자 역시 다른 기업으로 옮기면 그 기술의 가치를 충분히 인정받지 못할 수 있다. 이 때문에 양쪽 모두 지속적 고용관계를 유지할 유인을 갖는다.\n\n현장훈련은 실제 직무를 수행하며 기술을 익히게 하고, 하위직무에서 상위직무의 기능을 습득하도록 하므로 내부 승진과 연결된다. 관습은 과거의 관례와 전례에 의존하는 불문율로서 채용·훈련·임금지불 등 노사관계 전반을 지배하고, 고용안정성을 바탕으로 형성되는 동시에 내부노동시장을 강화한다. 원문은 내부시장의 임금·배치·훈련이 “관리규칙과 관리과정에 의하여 운영되고 있다는 점”을 강조한다(본문 72쪽, PDF 45쪽).\n\n외부시장과는 제한된 입직구·출직구를 통해 연결된다. 일반적으로 하위 직무가 입직구가 되고, 다른 직무의 결원은 이미 고용된 노동자의 승진·배치전환으로 충원된다. 선임권과 능률 등이 인사기준이 되며 내부 노동자는 외부 구직자와의 직접 경쟁에서 보호된다. 그러므로 ‘오래 고용한다’는 결과뿐 아니라 훈련·규칙·승진·외부와의 경계가 결합한 작동 방식을 설명해야 한다.&quot;, &quot;pages&quot;: &quot;본문 70~72쪽 · PDF 43~45쪽&quot;, &quot;keywords&quot;: &quot;기업특수기술 / 현장훈련 / 관습 / 내부 규칙 / 입직구&quot;}, {&quot;type&quot;: &quot;비교&quot;, &quot;q&quot;: &quot;이중노동시장론과 급진파 분단노동시장론의 강조점은 어떻게 다른가?&quot;, &quot;a&quot;: &quot;이중노동시장론은 노동시장이 1차시장과 2차시장으로 나뉜다고 본다. 1차시장은 주로 내부노동시장을 중심으로 형성되며 상대적으로 높은 임금, 좋은 근로조건, 다양한 승진기회와 고용안정성을 제공한다. 2차시장은 저임금, 열악한 조건, 제한된 승진기회와 고용불안정성이 특징이다. 원문은 피오레가 여러 구별 기준 중 특히 고용안정성에 주목했다고 설명한다.\n\n급진파의 분단노동시장론은 이러한 구분을 받아들이면서도, 그 분단이 어떤 역사적 과정과 권력관계에서 형성되었는지를 더 강조한다. 원문은 자본이 노동자계급을 “분할지배(divide and rule, divide and conquer)하는 전략으로 인하여 노동시장이 분할되고 있다고 보고 있다.”고 서술한다(본문 76쪽, PDF 49쪽). 분석의 초점은 경쟁적 자본주의에서 독점자본주의로의 이행, 생산관계의 변화, 자본의 노동통제이다.\n\n차이는 ‘어떤 시장으로 나뉘어 있는가’라는 특성의 분류와 ‘왜, 어떻게 그렇게 나뉘게 되었는가’라는 형성과정의 설명에 있다. 저자는 급진파가 계급관계를 지나치게 강조하는 면을 지적하면서도, 기술적 요인만으로 분단을 설명하는 한계를 넘어 노동시장분석에 역사적·동태적 시각을 부여한 점을 평가한다. 따라서 두 이론을 단순히 같은 이분법으로 묶으면 핵심 차이를 놓치게 된다.&quot;, &quot;pages&quot;: &quot;본문 73~79쪽 · PDF 46~52쪽&quot;, &quot;keywords&quot;: &quot;1차·2차시장 / 고용안정성 / 통제 / 분할지배 / 역사&quot;}, {&quot;type&quot;: &quot;비교&quot;, &quot;q&quot;: &quot;직무경쟁이론에서 교육은 인적자본이론과 어떤 점에서 다르게 해석되는가?&quot;, &quot;a&quot;: &quot;인적자본이론은 교육·훈련이 개인의 생산성을 높이고 그 생산성 차이가 임금격차로 이어진다고 설명한다. 반면 직무경쟁이론은 노동자들이 주로 경쟁하는 대상이 임금이 아니라 취업기회라고 본다. 직무와 임금이 사회적 관습·제도 및 기술적 조건에 의해 주어져 있는 상황에서, 고용주는 그 직무를 맡길 노동자를 채용서열에 따라 선발한다.\n\n원문은 “노동자서열은 교육정도, 성, 연령, 습관 등 개인적 특성의 노동시장에서의 상대적 위치에 의하여 결정된다.”라고 설명한다(본문 68쪽, PDF 41쪽). 고용주는 훈련비용을 줄이기 위해 훈련습득능력이나 적응성이 높은 사람을 원하지만 이를 직접 알기 어렵기 때문에 교육 등의 특성을 간접 판단 자료로 사용한다. 이 과정에는 고용주의 주관적 평가도 개입한다.\n\n이 관점에서 교육은 이미 완성된 생산성을 증명하는 것만이 아니라 채용 가능성과 직장 내 훈련 가능성을 판단하는 단서이다. 많은 기술은 취업 후 직무수행 과정에서 습득되며, 생산성과 임금도 개인뿐 아니라 그가 속한 집단과 직무에 영향을 받는다. 그러므로 두 이론을 비교할 때 ‘교육 → 생산성 → 소득’과 ‘교육 등 특성 → 채용서열 → 직무 진입과 현장훈련’이라는 서로 다른 설명 경로를 밝혀야 한다.&quot;, &quot;pages&quot;: &quot;본문 59~62쪽, 67~70쪽 · PDF 32~35쪽, 40~43쪽&quot;, &quot;keywords&quot;: &quot;생산성 향상 / 취업 기회 / 훈련 가능성 / 채용 순위&quot;}], &quot;korea&quot;: [{&quot;type&quot;: &quot;비판&quot;, &quot;q&quot;: &quot;저자는 인적자본이론을 당시 한국에 적용할 때 어떤 한계를 지적하는가?&quot;, &quot;a&quot;: &quot;저자의 비판은 교육이 임금에 영향을 미치지 않는다는 뜻이 아니라, 그 영향을 모두 생산성 향상으로 설명할 수 없다는 것이다. 원문은 한국에서 교육수준이 임금에 큰 영향을 미치지만, 생산성 차이를 통한 보상보다는 선별장치로서 작용하는 측면이 크다고 본다. 따라서 학력별 임금차이가 관찰된다는 사실만으로 인적자본이론의 설명이 입증되는 것은 아니다.\n\n원문은 교육이 “선별장치(screening device)로서 임금수준에 더 크게 영향을 미친다고 보는 것이 타당하다.”고 서술한다(본문 85쪽, PDF 58쪽). 또 당시 기업의 임금관리에는 연공서열형이 지배적이며, 같은 교육수준에서도 남녀 간 현격한 임금격차가 나타난다는 점을 든다. 임금이 생산성에 직접 대응한다고만 보면 이력·근속·성별과 제도의 영향을 충분히 설명하기 어렵다는 지적이다.\n\n본문 86쪽은 노동수요·공급에 대한 정보체계의 취약성과 정부의 강한 개입도 완전경쟁적 단일시장 가정을 적용하기 어렵게 만든다고 덧붙인다. 따라서 한국 노동시장을 분석할 때는 교육투자량과 개인 능력에 더하여 채용·선별 기준, 임금관리제도, 성별 차별과 시장의 제도적 조건을 함께 보아야 한다. 이 답안의 한국 상황은 저자가 분석한 당시를 가리키며 오늘날의 실태로 단정해서는 안 된다.&quot;, &quot;pages&quot;: &quot;본문 85~86쪽 · PDF 58~59쪽&quot;, &quot;keywords&quot;: &quot;학력 선별 / 연공 / 성별 격차 / 정보 / 정부 개입&quot;}, {&quot;type&quot;: &quot;비교&quot;, &quot;q&quot;: &quot;지속적 고용관계가 있다고 해서 미국식 내부노동시장이 존재한다고 볼 수 있는가?&quot;, &quot;a&quot;: &quot;지속적 고용관계가 있다는 사실만으로 미국식 내부노동시장이 존재한다고 단정할 수는 없다. 저자가 검토한 미국 모형에서는 기업특수기술과 OJT, 관습이 직무·기능 중심의 승진 및 임금체계와 결합한다. 훈련으로 습득한 기능이 임금과 승진에 연결되므로 기업과 노동자가 장기 고용을 유지하려는 유인이 생기고, 선임권과 내부 충원 규칙은 외부 경쟁으로부터 내부시장을 보호한다.\n\n반면 저자는 당시 한국에는 일반적으로 신분 중심 승진과 연공서열형 임금이 우세하다고 본다. 원문은 “그에 반하여 연공임금제도는 기업특수기능이나 현장훈련(OJT)과 직접적인 관계는 없다.”라고 설명한다(본문 89쪽, PDF 62쪽). 근속에 따라 임금이 오르면 고용 지속의 유인은 생길 수 있지만, 그것이 기업특수기술과 현장훈련에 기초한 미국 모형의 메커니즘과 같지는 않다는 뜻이다.\n\n또한 기능전달체계, 외부 인력 채용, 선임권제의 확립 여부, 노동자의 신청·지원에 따른 직무 충원인지 사용자의 일방적 배치인지도 비교한다. 따라서 분석에서는 ‘장기 고용이라는 겉모습’과 ‘그 고용을 형성·유지하는 제도와 작동 방식’을 구분해야 한다. 이 비판 역시 원문이 분석한 당시 한국을 대상으로 한다.&quot;, &quot;pages&quot;: &quot;본문 87~91쪽 · PDF 60~64쪽&quot;, &quot;keywords&quot;: &quot;지속적 고용과 구별 / 승진·임금 체계 / 선임권 / 충원&quot;}, {&quot;type&quot;: &quot;분류&quot;, &quot;q&quot;: &quot;고용안정성 또는 기업규모만으로 한국 노동시장을 나누는 데 어떤 한계가 있는가?&quot;, &quot;a&quot;: &quot;고용안정성만을 기준으로 나누면 같은 정도로 고용이 안정된 노동자들 사이의 임금·승진기회·근로조건 차이를 놓칠 수 있다. 저자는 당시 한국의 조직노동시장에서는 고용이 비교적 안정되어도 승진기회가 제한되고 임금과 근로조건이 낮은 노동자가 상당수 존재한다고 설명한다. 따라서 미국의 1차시장 특징들이 한국에서도 언제나 한 묶음으로 나타난다고 전제해서는 안 된다.\n\n원문은 “그러나 노동시장의 구체적인 분류기준이 없이 여러 개의 노동시장이 존재한다고 주장하는 것은 단일노동시장을 부정한다는 단순히 선언적인 의미를 가질 뿐이다.”라고 지적한다(본문 93쪽, PDF 66쪽). 즉, 분단이 있다는 주장만으로는 부족하고 어떤 기준으로 집단을 나누며 그 집단들이 왜 다른지 설명해야 한다.\n\n기업규모만을 기준으로 일본의 모형을 적용하는 데에도 한계가 있다. 원문이 소개하는 일본의 대기업시장은 낮은 이동, 폐쇄성, 종신고용·연공임금 등이 특징이고 중소기업시장은 이동성이 높다. 그러나 저자가 분석한 당시 한국은 대기업에 일본과 같은 종신고용이 확립되지 않았고 대기업과 중소기업 사이의 상호 이동도 빈번했다. 따라서 기업규모와 고용안정성을 임금·승진·이동·채용 관행과 함께 검토해야 한다.&quot;, &quot;pages&quot;: &quot;본문 92~93쪽 · PDF 65~66쪽&quot;, &quot;keywords&quot;: &quot;분류 기준 / 임금·승진·조건 / 기업 간 이동 / 국가별 차이&quot;}], &quot;structure&quot;: [{&quot;type&quot;: &quot;개념&quot;, &quot;q&quot;: &quot;노동시장의 주요 기능 네 가지는 무엇인가?&quot;, &quot;a&quot;: &quot;노동시장의 첫째 기능은 임금과 고용량을 결정하는 것이다. 노동력의 수요와 공급이 만나 노동서비스의 가격과 거래량이 정해진다. 둘째는 수요자와 공급자에게 정보와 신호를 제공하는 것이다. 임금과 구인·구직 정보는 어느 부문에 노동력이 필요하고 어떤 일자리가 있는지 판단하는 데 사용된다. 셋째는 노동서비스의 수요와 공급을 조정하여 전체적으로 일치시키는 것이다. 넷째는 일정한 인적자원을 여러 부문에 배분하는 것이다.\n\n저자는 “노동시장의 이러한 기능들이 잘 작동하여야 효율적이고 지속적인 성장이 가능하다.”라고 설명한다(본문 45쪽, PDF 18쪽). 예를 들어 어떤 상품의 수요가 늘어 해당 부문에 노동력이 더 필요해져도 시장이 분단되어 이동과 공급이 원활하지 않으면 생산 확대가 제한될 수 있다. 동시에 다른 부문에서는 노동력 과잉과 실업이 발생할 수 있다.\n\n따라서 네 기능은 서로 독립된 목록이 아니라 정보 제공, 수급 조정, 자원 배분과 임금·고용 결정이 연결된 체계이다. 저자는 그 기능이 시장구조의 형태에 따라 다르게 발휘된다고 보므로, 임금수준만 확인할 것이 아니라 진입 장벽·정보·이동 가능성 등 노동시장구조를 함께 이해해야 한다.&quot;, &quot;pages&quot;: &quot;본문 45~46쪽 · PDF 18~19쪽&quot;, &quot;keywords&quot;: &quot;결정 / 정보 / 수급 조정 / 자원 배분&quot;}, {&quot;type&quot;: &quot;방법&quot;, &quot;q&quot;: &quot;노동시장을 동태적으로 분석한다는 것은 무엇인가?&quot;, &quot;a&quot;: &quot;동태적 분석은 이미 주어진 노동시장구조 아래에서 현재의 수요·공급과 균형임금을 계산하는 것에 머무르지 않고, 그 구조가 어떻게 형성되었으며 왜 변화하는지를 분석하는 것이다. 원문은 “시장구조의 형성과 변화 그 자체를 분석대상으로 한다.”라고 명시한다(본문 47쪽, PDF 20쪽). 따라서 분석대상에는 어느 시장이 생기고 나뉘는지, 집단 사이의 이동과 진입을 제한하는 제도가 어떻게 만들어지는지가 포함된다.\n\n본문 96쪽은 노동시장구조가 고용관계의 결과이면서 그 나라 경제발달사의 산물이라고 설명한다. 현재의 임금격차나 고용형태는 단순한 개인 선택의 합뿐 아니라 과거의 경제발전, 노사 간 역학관계, 정부의 개입과 제도 변화 속에서 형성된 것으로 살펴야 한다. 같은 현재 모습이라도 그것이 만들어진 역사와 유지되는 메커니즘은 국가마다 다를 수 있다.\n\n예를 들어 ‘왜 A집단의 임금이 낮은가’라는 질문은 현재의 생산성만 비교하는 데서 그치지 않고, A집단이 특정 직무에 집중하게 된 채용·승진 규칙과 교육기회, 이동 제약이 어떻게 형성되었는지를 묻는 방향으로 확장된다. 이 예시는 원문의 분석 관점을 학습용으로 풀어 쓴 것이다. 핵심은 시간의 흐름을 단순히 나열하는 것이 아니라 구조 변화의 원인과 과정을 설명하는 데 있다.&quot;, &quot;pages&quot;: &quot;본문 47쪽, 96쪽 · PDF 20쪽, 69쪽&quot;, &quot;keywords&quot;: &quot;구조 자체 / 형성 / 변화 / 노사관계 / 역사&quot;}, {&quot;type&quot;: &quot;종합&quot;, &quot;q&quot;: &quot;저자가 지향하는 한국 노동시장 분석의 기본 관점을 서술하라.&quot;, &quot;a&quot;: &quot;저자가 제시하는 기본 관점은 세 가지로 정리할 수 있다. 노동시장을 불완전경쟁시장으로 보고, 거래되는 노동력을 이질적으로 취급되는 상품으로 보며, 노동시장을 동태적으로 분석한다. 원문은 “그런데 우리는 노동시장을 불완전경쟁시장으로, 노동력이라는 상품을 이질적인 상품으로 보고 노동시장을 동태적으로 분석하고자 한다.”라고 밝힌다(본문 96쪽, PDF 69쪽).\n\n여기서 이질성은 사람들의 본질적 가치가 다르다는 뜻이 아니다. 원문은 노동력이 차별화되기 쉽고 실제 시장에서 이질적인 상품으로 취급되어 거래되는 관행에 주목한다. 또한 노동력은 인격과 분리되지 않고, 생계를 위해 판매되어야 하며, 육성·훈련에 시간이 필요하다. 이러한 특수성이 국가별 노사 역학관계, 정부의 개입, 사회·문화적 배경, 교육·사회보장제도와 결합하면서 서로 다른 노동시장구조를 만든다.\n\n따라서 외국 이론을 그대로 대입하기보다 한국의 역사와 제도를 바탕으로 구조의 형성과 변화를 설명할 틀이 필요하다는 것이 결론이다. 제공된 발췌문은 일반적 분석틀인 ‘노동시장구조분석론’과 한국 분석을 위한 ‘단층노동시장모형’의 후속 전개를 예고한다. 본문 96쪽까지의 자료에서는 그 모형의 세부 내용이 아직 전개되지 않았으므로, 이를 이미 완성된 세부 모형처럼 설명해서는 안 된다.&quot;, &quot;pages&quot;: &quot;본문 94~96쪽 · PDF 67~69쪽&quot;, &quot;keywords&quot;: &quot;불완전경쟁 / 이질성 / 특수성 / 통합 / 동태적 분석&quot;}]};

        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>
